# LMCache GDS configuration for the remote nvfile test mount.
# The 192 MiB registered GPU buffer is intentional: this T4's cuFile setup
# accepts up to 192 MiB but rejects 224 MiB and larger during cuFileBufRegister.
chunk_size: 256
# LMCache always creates LocalCPUBackend as an allocator. Restrict both cache
# operations to GdsBackend so an in-process CPU hot tier cannot mask GDS I/O.
local_cpu: false
gds_path: "/mnt/nvfile/codex-gds-retest/lmcache-gds"
cufile_buffer_size: 192
store_location: "GdsBackend"
retrieve_locations:
  - "GdsBackend"
save_unfull_chunk: true
