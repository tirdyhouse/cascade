# LMCache GDS compatibility-mode configuration for GPUs whose BAR1 aperture
# cannot register a staging pool large enough for a whole 4K-token request.
# Layerwise retrieval streams smaller buffers and still restores every token.
chunk_size: 256
use_layerwise: true
local_cpu: false
gds_path: "/mnt/nvfile/codex-gds-retest/lmcache-gds-layerwise"
cufile_buffer_size: 192
store_location: "GdsBackend"
retrieve_locations:
  - "GdsBackend"
save_unfull_chunk: true
