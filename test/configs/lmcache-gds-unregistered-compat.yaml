# LMCache GDS compatibility-mode configuration for the Tesla T4 test host.
# A 256 MiB unregistered GPU pool is supplied by the opt-in sitecustomize
# shim; cuFile uses its supported bounce-buffer path instead of exhausting the
# GPU's 256 MiB BAR1 aperture with cuFileBufRegister.
chunk_size: 256
use_layerwise: false
local_cpu: false
gds_path: "/mnt/nvfile/codex-gds-retest/lmcache-gds-unregistered"
cufile_buffer_size: 256
store_location: "GdsBackend"
retrieve_locations:
  - "GdsBackend"
save_unfull_chunk: true
